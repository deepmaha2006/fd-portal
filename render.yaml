databases:
  - name: fdportal-db
    plan: free
    databaseName: fdportal
    user: fdportal

services:
  - type: web
    name: fd-portal
    plan: free
    runtime: node
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fdportal-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: UPLOAD_DIR
        value: /tmp/uploads
