version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fdportal
      POSTGRES_PASSWORD: fdportal123
      POSTGRES_DB: fdportal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdportal -d fdportal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Database Migrations + Seed (runs once, then exits) ───────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: >
      sh -c "npx prisma migrate deploy && npx tsx scripts/seed.ts"
    environment:
      DATABASE_URL: postgresql://fdportal:fdportal123@db:5432/fdportal
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ── Next.js Application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://fdportal:fdportal123@db:5432/fdportal
      NEXTAUTH_SECRET: "docker-dev-secret-change-in-prod-32bytes!!"
      NEXTAUTH_URL: "http://localhost:3000"
      APP_ENV: development
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "noreply@fdportal.dev"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
